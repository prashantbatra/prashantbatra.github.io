<div class="container" style="background-color: #5bccf6; width:100% ">
    <div class="row">
        <div class="col-lg-12 text-center" id="i18_skills">
            <div class="navy-line"></div>
            <h1><span data-i18n="skills.my_skills" style="color: black;font-weight:600;">My Skills</span></h1>
        </div>
    </div>
    <div class="row features-block">
        <div class="wow zoomIn col-lg-8 col-lg-offset-2">
            <div style="position: relative; width: 100%; max-width: 640px; margin: 0 auto; padding: 20px 0 45px;">
                <canvas id="{{ site.data.index.skills.id }}"></canvas>
            </div>
        </div>
        <div class="col-lg-1"></div>
        <script>
            var ctx = document.getElementById("{{ site.data.index.skills.id }}");
            var data = {
                labels: "{{ site.data.index.skills.aspects }}".split(","),
                datasets: [{
                    label: "{{ site.data.index.skills.label }}",
                    backgroundColor: "rgba(179,181,198,0.2)",
                    borderColor: "#005547",
                    pointBackgroundColor: "#005547",
                    pointBorderColor: "#fff",
                    pointHoverBackgroundColor: "#005547",
                    pointHoverBorderColor: "#005547",
                    data: [{{ site.data.index.skills.percentage }}]
            }]
        };
            var myRadarChart = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scale: {
                        ticks: { min: 0, max: 100, fontColor: "black" },
                        lineArc: false,
                        pointLabels: { fontSize: 15, fontColor: "black" },
                    },
                    legend: { display: false },
                }
            });
        </script>
    </div>
</div>
