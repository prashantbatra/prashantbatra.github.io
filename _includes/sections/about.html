<div class="container" id="i18_about_me" style="background-color:#fcde67;width:100%">
	<div class="row m-b-lg">
		<div class="col-lg-12 text-center">
			<div class="navy-line"></div>
			<h1><span data-i18n="about_me.about_me" style="color: black;font-weight:600;">About Me</span></h1>
		</div>
	</div>

	<div class="row">
		<div class="col-lg-8 col-lg-offset-2 text-center m-t-lg m-b-lg wow zoomIn">
			<p><span data-i18n="about_me.des1" style="color: black;">{{ site.author.desc1 }}</span></p>
			<p><span data-i18n="about_me.des2" style="color: black;">{{ site.author.desc2 }}</span></p>
			<p><span data-i18n="about_me.des3" style="color: black;">{{ site.author.desc3 }}</span></p>
			<p><span data-i18n="about_me.des4" style="color: black;">{{ site.author.desc4 }}</span></p>
			<p><span data-i18n="about_me.des5" style="color: black;">{{ site.author.desc5 }}</span></p>
		</div>
	</div>


	<section class="comparisonSection">
		<div class="comparisonImage beforeImage">
			<!-- <img src="https://assets.codepen.io/16327/before.jpg" alt="before"> -->
			<img src="/static/assets/img/landing/About3.png" style="object-fit: contain;" alt="before">
		</div>
		<div class="comparisonImage afterImage">
			<!-- <img src="https://assets.codepen.io/16327/after.jpg" alt="after"> -->
			<img src="/static/assets/img/landing/About.png" style="object-fit: contain;" alt="after">
		</div>
	</section>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
	<script>
		gsap.registerPlugin(ScrollTrigger);
		// Simple scrub reveal (no pin): as the section scrolls through the viewport the
		// grey "before" image is wiped away to reveal the colourful "after" image.
		// Works identically on desktop and touch devices.
		gsap.utils.toArray(".comparisonSection").forEach(function (section) {
			gsap.timeline({
				scrollTrigger: {
					trigger: section,
					start: "top 80%",
					end: "bottom 40%",
					scrub: true,
					invalidateOnRefresh: true
				},
				defaults: { ease: "none" }
			})
				.fromTo(section.querySelector(".afterImage"), { xPercent: 100, x: 0 }, { xPercent: 0 })
				.fromTo(section.querySelector(".afterImage img"), { xPercent: -100, x: 0 }, { xPercent: 0 }, 0);
		});
		window.addEventListener("load", function () { ScrollTrigger.refresh(); });
	</script>
</div>
